name: CI

on:
    push:
    pull_request:

jobs:
    backend-tests:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.13"
            - name: Install dependencies
              run: |
                  cd backend
                  pip install -r requirements.txt
            - name: Run tests
              env:
                  DATABASE_URL: sqlite:///./compliance.db
                  JWT_SECRET: test-jwt-secret
              run: |
                  cd backend
                  pytest

    backend-lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.13"
            - run: |
                  cd backend
                  pip install -r requirements.txt
                  ruff check .
                  ruff format --check .

    frontend-build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: 24.19.0
            - run: |
                  cd frontend
                  npm install
                  npm run build
